version: 2

models:
  - name: customers
    description: >
      One row per customer with lifetime order stats. Tagged `census` so it's picked
      up by a `tag:census` selector -- the model you'd expect to build a Census sync from.
    columns:
      - name: customer_id
        description: "Primary key for a customer."
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address."
        meta:
          contains_pii: true
      - name: phone
        description: "Customer phone number."
        meta:
          contains_pii: true
      - name: lifetime_value
        description: "Sum of completed order totals for this customer."

  - name: orders
    description: "One row per order line, joined with product details. Built with dbt_utils."
    columns:
      - name: order_line_id
        description: "Surrogate key generated by dbt_utils, unique per order line."
        tests:
          - unique
          - not_null

  - name: customer_events
    description: "Incrementally loaded order events, keyed by order_id."
    columns:
      - name: order_id
        description: "Primary key for an order event."
        tests:
          - unique
          - not_null

  - name: active_customers
    description: "View of customers who have placed at least one order."
    columns:
      - name: customer_id
        description: "Primary key for a customer."
        tests:
          - unique
          - not_null

  - name: customer_category_summary
    description: >
      One row per customer/category with order counts and totals. Added after the project's
      first refresh -- useful for exercising the "brand new model" path in Census's refresh
      (a name that has never had a Model row before), as opposed to updating an existing one.
    columns:
      - name: customer_id
        description: "Foreign key to customers."
      - name: category
        description: "Product category this row summarizes."

  - name: regional_sales_summary
    description: >
      One row per category with order counts, totals, and distinct customers. A distinctly new
      fqn never seen at any prior commit -- guarantees Census's next refresh treats it as a
      brand-new model rather than an update to an existing row.
    columns:
      - name: category
        description: "Product category this row summarizes."
      - name: order_count
        description: "Number of orders in this category."

  - name: product_performance_summary
    description: >
      One row per product/category with order counts, units sold, and revenue. Another
      distinctly new fqn never seen at any prior commit, for the same "brand new model"
      refresh-testing purpose as customer_category_summary and regional_sales_summary.
    columns:
      - name: product_name
        description: "Name of the product this row summarizes."
      - name: total_revenue
        description: "Sum of order totals for this product/category."
